[package]
name = "quest_emu" #QEMU!
version = "0.1.0"
edition = "2024"

[features]
default = ["ureq", "clap", "avd", "waydroid"]
ureq = ["dep:ureq"]

# Device backends; at least one is required.
# Android SDK emulator: `setup` installs the SDK/emulator/system image, `create`
# makes AVDs, `start`/`stop` run them.
avd = ["dep:zip"]
# Waydroid container, reached over TCP adb. Waydroid itself only runs on Linux.
waydroid = []

# Use reqwest for HTTP requests
# MBF-Agent uses ureq, so this will bloat the binary a bit.
reqwest = ["dep:reqwest"]
clap = ["dep:clap"]

[dependencies]
# No need for tracing support
color-eyre = { version = "0.6", default-features = false }

bytes = "*"
reqwest = { version = "0.12", features = [
    "blocking",
    "gzip",
    "deflate",
    "rustls-tls",
], default-features = false, optional = true }

ureq = { version = "3", features = [
    "socks-proxy",
    "charset",
    "gzip",
], optional = true }

# For APKs, the zip crate doesn't align the way V2 signature for Android requires. We use Laurie's amazing work here.
mbf-zip = { git = "https://github.com/Fernthedev/ModsBeforeFriday.git", package = "mbf-zip", branch = "dependency-improvements-and-man" }
mbf-axml = { git = "https://github.com/Fernthedev/ModsBeforeFriday.git", package = "mbf-axml", branch = "dependency-improvements-and-man" }
# awaiting PR https://github.com/Lauriethefish/ModsBeforeFriday/pull/81
mbf-res-man = { git = "https://github.com/Fernthedev/ModsBeforeFriday.git", package = "mbf-res-man", branch = "dependency-improvements-and-man" }

clap = { version = "4", features = ["derive"], optional = true  }

dirs = "7.0.0"

# Only used to extract the (plain Deflate) Android cmdline-tools zip; no need
# for the other codecs or the write-side zopfli compressor.
zip = { version = "9", default-features = false, optional = true, features = [
    "deflate-flate2-zlib-rs",
] }

itertools = "0.15"
indicatif = "0.18"
dialoguer = "0.12"

xml = "1.3"
semver = "1.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"

[[bin]]
name = "quest_emu"
path = "src/main.rs"
required-features = ["clap"]

[profile.release]
opt-level = 3
lto = true
strip = "symbols"
